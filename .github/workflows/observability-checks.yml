name: Observability checks
on:
  pull_request:
    paths:
      - 'src/taxi_mlops/observability/**'
      - 'tests/test_observability.py'
      - 'infrastructure/modules/monitoring/**'
      - 'infrastructure/environments/dev/monitoring.tf'
      - '.github/workflows/observability-checks.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test telemetry
        run: python -m pytest -q tests/test_observability.py
      - name: Lint telemetry
        run: python -m ruff check src/taxi_mlops/observability tests/test_observability.py
