name: Retrain NYC Taxi Models

on:
  workflow_dispatch:
    inputs:
      feature_prefix:
        description: "S3 prefix containing fare/ and demand/ feature datasets (use: features)"
        required: true
        default: features
        type: string
      candidate_id:
        description: "New unique candidate ID, e.g. retrain-20261025-002"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: nyc-taxi-retraining
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_REGION: us-east-1
      DATA_BUCKET: ${{ vars.TAXI_DATA_BUCKET }}
      AWS_ROLE_ARN: ${{ vars.AWS_RETRAIN_ROLE_ARN }}
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -c "import boto3; print('boto3 available')"

      - name: Run tests and lint
        run: |
          python -m pytest -q tests
          python -m ruff check src tests scripts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: taxi-nyc-retrain

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Download feature datasets
        shell: bash
        env:
          FEATURE_PREFIX: ${{ inputs.feature_prefix }}
        run: |
          set -euo pipefail
          if [[ "$FEATURE_PREFIX" != "features" ]]; then
            echo "::error::This workflow currently supports feature_prefix=features only"
            exit 1
          fi
          mkdir -p data/features
          aws s3 sync "s3://${DATA_BUCKET}/${FEATURE_PREFIX}/" data/features/ --only-show-errors
          for task in fare demand; do
            for split in train validation test; do
              file="data/features/${task}/year=2024/month=01/${split}.parquet"
              test -s "$file" || { echo "::error::Missing $file"; exit 1; }
            done
          done

      - name: Train models
        run: |
          python scripts/train_models.py \
            --config configs/training.yaml \
            --data-root data/features \
            --output artifacts/models \
            --task all

      - name: Verify model artifacts
        run: |
          test -s artifacts/models/fare/model.joblib
          test -s artifacts/models/fare/metrics.json
          test -s artifacts/models/demand/model.joblib
          test -s artifacts/models/demand/metrics.json
          test -s artifacts/models/summary.json
          python -m json.tool artifacts/models/summary.json > /dev/null

      - name: Upload candidate artifacts to S3
        shell: bash
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_ID" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,79}$ ]] || [[ "$CANDIDATE_ID" == "." ]] || [[ "$CANDIDATE_ID" == ".." ]]; then
            echo "::error::Invalid candidate_id"
            exit 1
          fi
          PREFIX="models/candidates/${CANDIDATE_ID}"
          if aws s3api head-object --bucket "$DATA_BUCKET" --key "$PREFIX/summary.json" >/dev/null 2>&1; then
            echo "::error::Candidate already exists: $PREFIX"
            exit 1
          fi
          aws s3 cp artifacts/models/ "s3://${DATA_BUCKET}/${PREFIX}/" --recursive --only-show-errors

      - name: Register candidate version
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          FEATURE_PREFIX: ${{ inputs.feature_prefix }}
        run: |
          python scripts/register_model_version.py \
            --bucket "$DATA_BUCKET" \
            --candidate-id "$CANDIDATE_ID" \
            --artifact-root artifacts/models \
            --feature-prefix "$FEATURE_PREFIX" \
            --github-run-id "$GITHUB_RUN_ID" \
            --git-sha "$GITHUB_SHA" \
            --output artifacts/registry/version.json

      - name: Upload training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retraining-evidence-${{ github.run_id }}
          path: |
            artifacts/models/**/metrics.json
            artifacts/models/summary.json
            artifacts/registry/version.json
            mlflow.db
          if-no-files-found: warn
          retention-days: 30
