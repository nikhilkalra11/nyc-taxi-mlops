training:
  seed: 42
  models: [lightgbm, xgboost]
  target:
    fare: fare_amount
    demand: demand
  features:
    fare: [PULocationID, DOLocationID, trip_distance, passenger_count, pickup_hour, pickup_dayofweek, pickup_month]
    demand: [PULocationID, lag_1, lag_24, lag_168, rolling_mean_24, rolling_mean_168, hour_of_day, day_of_week, month]
  hyperparameters:
    lightgbm:
      n_estimators: 180
      learning_rate: 0.05
      num_leaves: 31
      n_jobs: 2
      verbosity: -1
    xgboost:
      n_estimators: 180
      max_depth: 6
      learning_rate: 0.05
      tree_method: hist
      n_jobs: 2
  selection_metric: validation_rmse
  max_training_rows: 300000
  max_validation_rows: 100000
  max_test_rows: 100000
  mlflow_experiment: nyc-taxi-milestone4
  mlflow_tracking_uri: ./mlruns
aws:
  region: us-east-1
  s3_prefix: training
  sagemaker_instance_type: ml.m5.xlarge
