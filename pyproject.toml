# REFERENCE ONLY: merge additions into your existing root pyproject.toml.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-mlops"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "requests>=2.32,<3",
  "PyYAML>=6,<7",
  "boto3>=1.35,<2",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.3,<5",
  "xgboost>=2.1,<4",
  "mlflow>=2.18,<4",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1","httpx2"]
aws-training = ["sagemaker>=2.220,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
