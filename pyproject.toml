[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "nyc-taxi-mlops"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["pandas>=2.2,<3", "pyarrow>=17,<24", "requests>=2.32,<3", "PyYAML>=6,<7", "boto3>=1.35,<2", "numpy>=1.26,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
